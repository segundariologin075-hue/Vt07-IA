<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d19">
<title>vf07IA — Sua inteligência</title>
<style>
:root{--bg:#080d19;--panel:#101a2b;--panel2:#14233a;--line:#263a59;--blue:#3488f5;--blue2:#68b0ff;--text:#f4f7fc;--muted:#9fb0c9;--danger:#ff7373}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100dvh}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{max-width:900px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:#0b1220;position:sticky;top:0;z-index:3}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#1d4d8e,#12223d);border:1px solid #3869a4;display:grid;place-items:center;font-weight:900;letter-spacing:-1px;color:#dcecff}
.brand{flex:1}.brand strong{display:block;font-size:18px;letter-spacing:.2px}.brand small{color:var(--muted);font-size:11px;letter-spacing:1.2px}
.iconbtn,.smallbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 11px}
.layout{display:flex;flex:1;min-height:0}
.sidebar{width:245px;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;background:#0a1120}
.primary{background:var(--blue);border:0;color:white;border-radius:12px;padding:12px;font-weight:700}
.sideheading{font-size:11px;color:var(--muted);letter-spacing:1px;margin:10px 4px 0}
.history{display:flex;flex-direction:column;gap:5px;overflow:auto}
.histitem{display:flex;gap:7px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;color:var(--muted);padding:10px;border-radius:10px;min-width:0}
.histitem span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.histitem.active,.histitem:hover{background:var(--panel2);border-color:var(--line);color:var(--text)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.status{padding:9px 16px;background:#0d1727;color:#a9bdd8;font-size:12px;border-bottom:1px solid #1c2b43}
.status b{color:#f2c879}
.messages{flex:1;padding:22px 16px 16px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.welcome{max-width:600px;margin:7vh auto 0;text-align:center;width:100%}
.welcome .orb{width:70px;height:70px;margin:0 auto 18px;border-radius:23px;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#326fbb,#12213b 72%);border:1px solid #39659a;color:#cfe7ff;font-size:27px}
h1{font-size:clamp(26px,6vw,36px);margin:0 0 10px}.welcome p{color:var(--muted);line-height:1.55;margin:0 auto 22px;max-width:460px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-width:520px;margin:0 auto}
.quick button{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:13px 11px;text-align:left;border-radius:14px;line-height:1.35}
.quick button:hover{border-color:#4e83c6;background:#12213a}.quick small{display:block;color:var(--muted);margin-top:5px;font-size:12px}
.msg{display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto;align-items:flex-start}
.avatar{flex:0 0 32px;width:32px;height:32px;border-radius:10px;background:#18345a;display:grid;place-items:center;color:#cde4ff;font-size:12px;font-weight:800}
.msg.user .avatar{background:#263449;color:#fff}.bubble{min-width:0;max-width:calc(100% - 42px);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.userbubble{background:#15243a;border:1px solid #263d5c;border-radius:15px;padding:10px 13px}
.bubble p{margin:0 0 9px}.bubble p:last-child{margin-bottom:0}.bubble .note{color:var(--muted);font-size:13px}
.attached{max-width:180px;max-height:180px;object-fit:contain;border-radius:12px;border:1px solid var(--line);display:block;margin-top:8px}
.composerwrap{padding:10px 14px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#080d19 18%)}
.composer{max-width:760px;margin:auto;border:1px solid #334b6d;background:#101a2a;border-radius:18px;padding:10px;box-shadow:0 8px 30px #0003}
#prompt{width:100%;resize:none;min-height:45px;max-height:150px;background:transparent;border:0;outline:0;color:var(--text);padding:8px;font-size:16px}
.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.tools button{background:#17263b;border:1px solid #2c4262;color:#d8e6f8;border-radius:10px;padding:8px 10px}
.tools .send{margin-left:auto;background:var(--blue);border-color:var(--blue);font-weight:800;min-width:44px}
.tools .listening{background:#5b2330;border-color:#b74d63}
.disclaimer{text-align:center;color:#71839e;font-size:11px;line-height:1.45;padding:8px 12px 0;max-width:760px;margin:auto}
.mobileonly{display:none}
.empty{color:var(--muted);font-size:13px;padding:8px}
#imageInput{display:none}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1c2b43;color:white;border:1px solid #456184;padding:10px 14px;border-radius:12px;display:none;z-index:10;max-width:90vw;font-size:13px}
@media(max-width:650px){.sidebar{display:none}.mobileonly{display:inline-flex}.messages{padding-top:16px}.welcome{margin-top:5vh}.quick{gap:8px}.quick button{padding:12px 10px;font-size:14px}.status{font-size:11px}.composerwrap{padding-left:9px;padding-right:9px}.tools button{padding:8px 9px}.brand small{font-size:10px}}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="iconbtn mobileonly" id="menuBtn" aria-label="Mostrar histórico">☰</button>
  <div class="logo">VF07</div>
  <div class="brand"><strong>vf07IA</strong><small>SUA INTELIGÊNCIA • VERSÃO 1.0</small></div>
  <button class="iconbtn" id="newTop" title="Nova conversa">＋</button>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <button class="primary" id="newBtn">＋ Nova conversa</button>
    <div class="sideheading">HISTÓRICO SALVO NESTE NAVEGADOR</div>
    <div class="history" id="history"></div>
    <div style="margin-top:auto;display:grid;gap:8px">
      <button class="smallbtn" id="exportBtn">⇩ Exportar histórico</button>
      <button class="smallbtn" id="clearBtn">Excluir todo o histórico</button>
    </div>
  </aside>
  <main class="main">
    <div class="status">● <b>Modo demonstração</b> — o chat e o histórico funcionam; a IA online ainda precisa ser conectada.</div>
    <section class="messages" id="messages" aria-live="polite"></section>
    <div class="composerwrap">
      <div class="composer">
        <textarea id="prompt" rows="1" placeholder="Pergunte qualquer coisa à vf07IA..." aria-label="Sua mensagem"></textarea>
        <div id="attachmentArea"></div>
        <div class="tools">
          <button id="attachBtn" title="Selecionar imagem">＋ Imagem</button>
          <input type="file" id="imageInput" accept="image/*">
          <button id="voiceBtn" title="Ditado por voz">🎙 Voz</button>
          <button id="readBtn" title="Ler última resposta">🔊 Ler</button>
          <button class="send" id="sendBtn" title="Enviar mensagem">➤</button>
        </div>
      </div>
      <div class="disclaimer">A versão inicial salva o histórico apenas neste navegador. Não envie dados pessoais ou informações confidenciais.</div>
    </div>
  </main>
</div>
</div>
<div id="toast"></div>
<script>
(() => {
const KEY='vf07ia_chats_v1';
const $=id=>document.getElementById(id);
let chats=[], currentId=null, selectedImage=null, listening=false;
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2800)}
function load(){try{chats=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){chats=[]}if(!Array.isArray(chats))chats=[];if(chats.length){currentId=chats[0].id}else newChat(false);renderHistory();renderMessages()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(chats))}catch(e){toast('Armazenamento cheio. Exporte e apague conversas antigas.')}renderHistory()}
function current(){return chats.find(c=>c.id===currentId)}
function newChat(doRender=true){const c={id:uid(),title:'Nova conversa',updated:Date.now(),messages:[]};chats.unshift(c);currentId=c.id;save();if(doRender)renderMessages();$('prompt').focus()}
function renderHistory(){
 const root=$('history');root.innerHTML='';
 if(!chats.length){root.innerHTML='<div class="empty">Nenhuma conversa salva ainda.</div>';return}
 chats.slice().sort((a,b)=>b.updated-a.updated).forEach(c=>{
  const b=document.createElement('button');b.className='histitem'+(c.id===currentId?' active':'');
  const icon=document.createElement('span');icon.textContent='▤';icon.style.flex='0 0 auto';
  const label=document.createElement('span');label.textContent=c.title||'Nova conversa';
  b.append(icon,label);b.onclick=()=>{currentId=c.id;renderHistory();renderMessages();if(innerWidth<=650)$('sidebar').style.display='none'};root.appendChild(b);
 });
}
function welcomeHTML(){return `<div class="welcome"><div class="orb">✦</div><h1>Olá! Eu sou a vf07IA.</h1><p>Um espaço para tirar dúvidas, criar conteúdo e organizar suas ideias. O chat está em modo demonstração enquanto conectamos o modelo de IA.</p><div class="quick"><button data-prompt="Explique um assunto difícil de um jeito simples.">💬 Conversar<small>Perguntas e explicações</small></button><button data-prompt="Crie 5 ideias de vídeos curtos com gancho, roteiro e chamada para ação.">✦ Criar conteúdo<small>Ideias e roteiros</small></button><button data-prompt="Monte uma estratégia de conteúdo para TikTok Shop, sem promessas de vendas garantidas.">▣ TikTok Shop<small>Conteúdo para vender</small></button><button data-prompt="Crie um prompt detalhado em inglês para gerar um vídeo vertical realista de produto.">▧ Prompts de vídeo<small>Prompts detalhados</small></button></div></div>`}
function renderMessages(){
 const root=$('messages');root.innerHTML='';const c=current();
 if(!c||!c.messages.length){root.innerHTML=welcomeHTML();root.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset.prompt;resizeInput();$('prompt').focus()});return}
 c.messages.forEach(m=>{
  const row=document.createElement('div');row.className='msg '+(m.role==='user'?'user':'assistant');
  const av=document.createElement('div');av.className='avatar';av.textContent=m.role==='user'?'VOCÊ':'VF';
  const bubble=document.createElement('div');bubble.className='bubble'+(m.role==='user'?' userbubble':'');bubble.textContent=m.text;
  if(m.image){const im=document.createElement('img');im.src=m.image;im.className='attached';im.alt='Imagem anexada';bubble.appendChild(im)}
  row.append(av,bubble);root.appendChild(row);
 });
 root.scrollTop=root.scrollHeight;
}
function addMsg(role,text,image=null){const c=current();if(!c)return;const m={role,text,image,at:Date.now()};c.messages.push(m);c.updated=Date.now();if(role==='user'&&c.title==='Nova conversa'){c.title=text.slice(0,36)||'Imagem enviada';if(text.length>36)c.title=c.title.slice(0,33)+'…'}save();renderMessages()}
function demoReply(text,hasImage){
 const t=text.toLowerCase();
 if(hasImage)return 'Recebi sua imagem na interface! Para analisá-la de verdade, falta conectar um modelo de IA com visão. Por enquanto, posso ajudar se você descrever o que aparece na foto.';
 if(/tiktok|shop|vender|produto/.test(t))return 'Vamos montar um conteúdo para TikTok Shop.\\n\\n1. Gancho (0–3 s): mostre o benefício mais interessante do produto.\\n2. Demonstração: mostre como ele funciona e para quem pode ser útil.\\n3. Prova: use apenas características verificáveis e imagens reais.\\n4. CTA: “Confira os detalhes do produto no link”.\\n\\nDica: evite prometer resultados garantidos. Esta resposta é um exemplo local; ao conectar a IA, ela poderá adaptar o roteiro ao seu produto.';
 if(/prompt|vídeo|video|imagem/.test(t))return 'Posso ajudar a preparar um prompt. Exemplo de estrutura:\\n\\n“Create a realistic vertical 9:16 product video, natural lighting, clear close-up shots, authentic textures, smooth camera movement, clean background, no on-screen text, with a strong visual hook in the first 3 seconds.”\\n\\nDepois, especifique o produto, cenário, público e estilo. A geração da imagem ou do vídeo será feita por uma ferramenta externa, quando conectada.';
 if(/pesquis|atual|hoje|notícia|noticia/.test(t))return 'A pesquisa ao vivo na internet ainda não está conectada, então não vou inventar informações atuais. Na próxima etapa podemos integrar uma fonte de busca e mostrar os links consultados.';
 if(/olá|ola|oi|bom dia|boa tarde|boa noite/.test(t))return 'Olá! 👋 Sou a vf07IA, seu projeto de assistente pessoal. Nesta versão já consigo guardar suas conversas neste navegador e oferecer atalhos de criação. Para respostas inteligentes completas, vamos conectar um modelo de IA na próxima etapa.';
 return 'Recebi sua mensagem! Esta primeira versão já salva a conversa e mantém o histórico neste navegador.\\n\\nAinda estou em modo demonstração, então não consigo raciocinar como uma IA real nem consultar a internet até conectarmos um modelo de linguagem.\\n\\nPróximo passo: configurar uma API através de um backend seguro, sem expor a chave no site público.';
}
function send(){
 const text=$('prompt').value.trim();if(!text&&!selectedImage){toast('Digite uma mensagem ou selecione uma imagem.');return}
 const image=selectedImage;addMsg('user',text||'Analise esta imagem',image);$('prompt').value='';selectedImage=null;$('attachmentArea').innerHTML='';resizeInput();
 setTimeout(()=>{addMsg('assistant',demoReply(text,!!image))},250);
}
function resizeInput(){const p=$('prompt');p.style.height='auto';p.style.height=Math.min(p.scrollHeight,150)+'px'}
$('sendBtn').onclick=send;$('prompt').addEventListener('input',resizeInput);$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('newBtn').onclick=()=>newChat();$('newTop').onclick=()=>newChat();
$('attachBtn').onclick=()=>$('imageInput').click();
$('imageInput').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Escolha um arquivo de imagem.');return}if(f.size>3*1024*1024){toast('Escolha uma imagem de até 3 MB nesta versão.');return}const r=new FileReader();r.onload=()=>{selectedImage=r.result;$('attachmentArea').innerHTML='';const wrap=document.createElement('div');wrap.style.cssText='display:flex;align-items:center;gap:8px;padding:7px';const img=document.createElement('img');img.src=selectedImage;img.style.cssText='width:48px;height:48px;object-fit:cover;border-radius:8px';const label=document.createElement('span');label.textContent='Imagem pronta para enviar';label.style.cssText='font-size:12px;color:#9fb0c9';const remove=document.createElement('button');remove.textContent='×';remove.className='smallbtn';remove.onclick=()=>{selectedImage=null;$('attachmentArea').innerHTML='';$('imageInput').value=''};wrap.append(img,label,remove);$('attachmentArea').append(wrap)};r.readAsDataURL(f);e.target.value=''};
$('voiceBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Ditado por voz não é compatível com este navegador. Tente o microfone do teclado.');return}if(listening)return;const rec=new SR();rec.lang='pt-BR';rec.interimResults=false;rec.onstart=()=>{listening=true;$('voiceBtn').classList.add('listening');$('voiceBtn').textContent='🎙 Ouvindo…'};rec.onend=()=>{listening=false;$('voiceBtn').classList.remove('listening');$('voiceBtn').textContent='🎙 Voz'};rec.onerror=()=>toast('Não foi possível usar o microfone. Confira a permissão do navegador.');rec.onresult=e=>{$('prompt').value+=($('prompt').value?' ':'')+e.results[0][0].transcript;resizeInput()};rec.start()};
$('readBtn').onclick=()=>{if(!('speechSynthesis'in window)){toast('Leitura por voz não é compatível neste navegador.');return}const c=current();const m=c&&[...c.messages].reverse().find(x=>x.role==='assistant');if(!m){toast('Ainda não há resposta para ler.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m.text);u.lang='pt-BR';speechSynthesis.speak(u)};
$('clearBtn').onclick=()=>{if(!confirm('Apagar todas as conversas salvas neste navegador? Esta ação não pode ser desfeita.'))return;chats=[];currentId=null;newChat();toast('Histórico apagado.')};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(chats,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vf07ia-historico.json';a.click();URL.revokeObjectURL(url)};
$('menuBtn').onclick=()=>{const s=$('sidebar');s.style.display=s.style.display==='flex'?'none':'flex';if(s.style.display==='flex'){s.style.position='absolute';s.style.zIndex='5';s.style.top='73px';s.style.bottom='0';s.style.boxShadow='10px 0 25px #0008'}};
load();
})();
</script>
</body>
</html>
